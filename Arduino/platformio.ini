; PlatformIO Project Configuration File
;   HaTarim firmware — TFT-only (Grove RGB LCD removido em 2026-04-27)

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
; compila só o firmware do Mega (TFT): apenas main.cpp.
; (filtro antigo +<*> -<esp32/> deixava vazar esp32_oled/, esp32_probe/, etc.)
build_src_filter = -<*> +<main.cpp>
lib_deps =
    prenticedavid/MCUFRIEND_kbv@^3.0.0
    adafruit/Adafruit GFX Library@^1.11.0

; Supervisório ESP32-C6 — fase 1: lê o LED da placa-mãe do OpenFrame (GPIO2)
; e reporta atividade pelo Serial (USB nativo). Display entra na fase 2.
[env:esp32_led]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
; Serial sai pela USB-Serial/JTAG nativo da C6 (HWCDC). O par é obrigatório:
; só CDC_ON_BOOT sem USB_MODE=1 faz o core procurar USBSerial (TinyUSB) e quebra.
build_flags = -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1
; compila só o firmware da ESP32
build_src_filter = -<*> +<esp32/>

; VU meter do HD no OLED SSD1306 (fase 2): lê duty do HDD_LED e desenha barra.
[env:esp32_oled]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags = -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = -<*> +<esp32_oled/>
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.0
    adafruit/Adafruit GFX Library@^1.11.0

; SONDA do HDD_LED: loga duty cru + bordas/Hz da main board NOVA (diagnóstico).
[env:esp32_probe]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags = -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = -<*> +<esp32_probe/>

; SONDA COM DISPLAY: caça-pino com feedback no OLED (LVL/duty/bordas ao vivo).
[env:esp32_probe_oled]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags = -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = -<*> +<esp32_probe_oled/>
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.0
    adafruit/Adafruit GFX Library@^1.11.0

; Scan I2C: descobre o endereço do OLED no barramento SDA=GPIO6 / SCL=GPIO7.
[env:esp32_i2cscan]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags = -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = -<*> +<esp32_i2cscan/>

; Teste MÍNIMO de sanidade: só uptime no Serial, sem RGB/GPIO/RMT. Separa HW de FW.
[env:esp32_mintest]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags = -D ARDUINO_USB_MODE=1 -D ARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = -<*> +<esp32_mintest/>

; Smoke test: pisca o RGB LED onboard da C6 (GPIO8). Não é o supervisor.
[env:esp32_blink]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<esp32_blink/>
